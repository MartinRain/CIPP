name: AuditLog PSScriptAnalyzer validation

on:
  push:
    branches:
      - fix/auditlog-organization-customization-wait

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $targets = @(
            './backend/Modules/CIPPStandards/Public/Standards/Invoke-CIPPStandardAuditLog.ps1',
            './backend/Modules/CIPPCore/Public/Baselines/Invoke-CIPPBaselineExoRequest.ps1'
          )
          $results = foreach ($file in $targets) {
            Invoke-ScriptAnalyzer -Path $file -Severity Error,Warning -ExcludeRule PSAvoidUsingWriteHost
          }
          if ($results) {
            $results | Format-Table -AutoSize
            $errors = @($results | Where-Object Severity -EQ 'Error')
            if ($errors.Count -gt 0) { throw "PSScriptAnalyzer found $($errors.Count) error(s)." }
          }
