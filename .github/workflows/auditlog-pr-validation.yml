name: AuditLog PR validation

on:
  push:
    branches:
      - fix/auditlog-organization-customization-wait

permissions:
  contents: read

jobs:
  pester:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester 5
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run AuditLog regression tests
        shell: pwsh
        run: |
          Invoke-Pester -Path ./backend/Tests/Standards/Invoke-CIPPStandardAuditLog.Tests.ps1 -CI

      - name: Run Standards and Baselines Pester suites
        shell: pwsh
        run: |
          Invoke-Pester -Path ./backend/Tests/Standards,./backend/Tests/Baselines -CI
